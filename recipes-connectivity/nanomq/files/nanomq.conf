auth {
  allow_anonymous = false
  password = {include "/etc/nanomq_pwd.conf"}
}

listeners.ssl {
  bind = "0.0.0.0:8883"                   # Bind to all network interfaces on port 8883
  keyfile = "/etc/nanomq/certs/server.key"       # Key file path
  certfile = "/etc/nanomq/certs/server.crt"      # User certificate file path
  cacertfile = "/etc/nanomq/certs/ca.crt"	  # CA certificate file path
  verify_peer = true		          # If NanoMQ requests a certificate from the client	
  fail_if_no_peer_cert = true	          # If to reject connection if no certificate is provided
}

listeners.tcp {
  bind = "127.0.0.1:1883"
}

