# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-igokraj"
BBFILE_PATTERN_meta-igokraj = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-igokraj = "6"

LAYERDEPENDS_meta-igokraj = "core"
LAYERSERIES_COMPAT_meta-igokraj = "scarthgap"
